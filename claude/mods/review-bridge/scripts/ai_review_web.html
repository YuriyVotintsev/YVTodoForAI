<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Review</title>
<style>
:root {
  --bg: #faf9f5; --bg-side: #f3f1ea; --panel: #ffffff; --raise: #ebe8df; --border: #e3e0d6; --border-strong: #d2cec2;
  --text: #1f1e1d; --text-2: #3d3c38; --dim: #77756c; --faint: #a6a399;
  --green: #2e7d32; --red: #c0392b;
  --add: rgba(46,160,67,.11); --add-g: rgba(46,160,67,.19); --del: rgba(220,60,50,.09); --del-g: rgba(220,60,50,.17);
  --accent: #2f6fe4; --accent-soft: rgba(47,111,228,.12); --sel: rgba(47,111,228,.14); --cmt: rgba(47,111,228,.09);
  --hunk: #f0eee7; --shadow: 0 6px 22px rgba(0,0,0,.08); --scrim: rgba(30,28,24,.28);
  --claude: #c96442; --amber: #b7791f; --sky: #1b8ad3;
  --k: #8a3ccf; --s: #9a6700; --c: #8b887f; --nm: #b4580c; --ty: #0b6a9e; --pp: #6e56cf;
  --ui: "Styrene B", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #262624; --bg-side: #1f1e1d; --panel: #30302e; --raise: #383835; --border: #3a3a37; --border-strong: #4b4a46;
    --text: #f0eee6; --text-2: #d6d3c8; --dim: #a19f96; --faint: #6f6d66;
    --green: #74c476; --red: #ec6f63;
    --add: rgba(70,150,95,.16); --add-g: rgba(70,150,95,.26); --del: rgba(229,83,75,.14); --del-g: rgba(229,83,75,.24);
    --accent: #3b7ff2; --accent-soft: rgba(59,127,242,.2); --sel: rgba(90,135,215,.2); --cmt: rgba(59,127,242,.14);
    --hunk: #2b2b29; --shadow: 0 10px 30px rgba(0,0,0,.4); --scrim: rgba(0,0,0,.5);
    --claude: #d97757; --amber: #e0a43a; --sky: #6cc4ff;
    --k: #c9a2f2; --s: #e3c08d; --c: #807d75; --nm: #f0a774; --ty: #86c6ec; --pp: #b4a6ff;
  }
}
* { box-sizing: border-box; scrollbar-color: var(--border-strong) transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
svg { flex: none; }
.top { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; min-width: 0; }
.ib { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; border: 0; background: transparent; color: var(--dim); cursor: pointer; flex: none; padding: 0; }
.ib:hover { background: var(--raise); color: var(--text); }
.ib.on { background: var(--accent); color: #fff; }
.crumb { display: flex; align-items: center; gap: 7px; font-size: 15px; color: var(--text-2); white-space: nowrap; min-width: 0; }
.crumb .ar { color: var(--faint); }
.crumb .br { color: var(--text); }
.crumb .sc { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.stats { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.live { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12px; white-space: nowrap; cursor: default; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.live.on i { background: #4fbf67; box-shadow: 0 0 0 3px rgba(79,191,103,.18); }
.live.off i { background: var(--red); }
.pbtn { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.pbtn:hover, .pbtn.open { background: var(--raise); color: var(--text); border-color: var(--border-strong); }
.pbtn .lb { color: var(--dim); }
.pbtn .dd { color: var(--dim); display: grid; }
.seg { display: flex; background: var(--raise); border-radius: 8px; padding: 2px; flex: none; }
.seg button { border: 0; background: transparent; color: var(--dim); padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.main { flex: 1; display: flex; min-height: 0; }
.side { width: 360px; flex: none; display: flex; flex-direction: column; background: var(--bg-side); min-height: 0; }
.side.hidden, .side.hidden + .resizer { display: none; }
.resizer { flex: none; width: 1px; background: var(--border); position: relative; z-index: 4; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: -5px; width: 11px; cursor: col-resize; }
.resizer:hover, .resizer.on { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.resizing, .resizing * { cursor: col-resize !important; user-select: none !important; }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; }
.tab { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; color: var(--dim); cursor: pointer; display: flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--text); }
.tab.sel { background: var(--raise); color: var(--text); }
.tab .cnt { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tools { padding: 8px 8px 4px; display: flex; flex-direction: column; gap: 8px; }
.search { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; height: 30px; color: var(--dim); }
.search:focus-within { border-color: var(--border-strong); }
.search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--dim); cursor: pointer; font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.on { background: var(--raise); color: var(--text); border-color: var(--border-strong); }
.list { flex: 1; overflow: auto; padding: 2px 6px 8px; min-height: 0; }
.vl { position: relative; }
.vw { position: absolute; left: 0; right: 0; top: 0; }
.it { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; min-width: 0; font-size: 13.5px; contain: layout paint; position: relative; }
.it:hover { background: var(--raise); }
.it.act { background: var(--raise); box-shadow: inset 2px 0 0 var(--accent); }
.it .fi { color: var(--dim); display: grid; place-items: center; width: 16px; }
.it > .fi, .it > .chev, .it > .num, .it > .cbub { flex: none; }
.it .nm { color: var(--text); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 40px; }
.it.hc:not(.dir) { background: var(--cmt); }
.it.hc:not(.dir):hover, .it.hc:not(.dir).act { background: var(--raise); }
.it .pt { color: var(--dim); overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; font-size: 12.5px; direction: rtl; text-align: right; margin-left: 4px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.plus { color: var(--green); }
.minus { color: var(--red); }
.cbub { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--accent); }
.empty { color: var(--dim); padding: 14px 10px; }
.sect { border-top: 1px solid var(--border); flex: none; height: 260px; display: flex; flex-direction: column; position: relative; }
.sect.closed { height: auto !important; }
.vresizer { position: absolute; top: -5px; left: 0; right: 0; height: 9px; cursor: row-resize; z-index: 4; }
.vresizer::after { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; }
.vresizer:hover::after, .vresizer.on::after { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.sect.closed .vresizer { display: none; }
.resizing-v, .resizing-v * { cursor: row-resize !important; user-select: none !important; }
.sect-h { display: flex; align-items: center; gap: 6px; padding: 9px 12px; color: var(--dim); cursor: pointer; user-select: none; }
.sect-h .chev { transform: rotate(90deg); }
.sect.closed .sect-h .chev { transform: none; }
.sect.closed .sect-b { display: none; }
.sect-b { overflow: auto; padding: 0 6px 8px; flex: 1; min-height: 0; }
.chev { color: var(--dim); transition: transform .12s; display: grid; place-items: center; }
.scope { padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text-2); font-size: 13.5px; }
.scope:hover { background: var(--raise); }
.scope.sel { background: var(--raise); color: var(--text); }
.scope .sub { color: var(--dim); font-size: 12px; font-family: var(--mono); margin-top: 2px; }
.scope .sj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diffs { flex: 1; overflow: auto; min-width: 0; padding-bottom: 40vh; position: relative; }
.notice { color: var(--dim); padding: 18px 20px; font-size: 14px; }
.fh { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 8px 0 16px; background: var(--bg); white-space: nowrap; min-width: 0; font-size: 14px; box-shadow: 0 1px 0 var(--border); }
.fh .fi { color: var(--dim); display: grid; place-items: center; }
.fh .nm { color: var(--text); overflow: hidden; text-overflow: ellipsis; min-width: 48px; flex: 0 1 auto; }
.it .nm.added, .fh .nm.added { color: var(--green); }
.it .nm.deleted, .fh .nm.deleted { color: var(--red); }
.fh { overflow: hidden; }
.fh > :not(.nm):not(.pt):not(.spacer) { flex-shrink: 0; }
.fh .pt { color: var(--dim); overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 13px; direction: rtl; text-align: left; }
.trow { display: flex; gap: 6px; align-items: center; }
.trow .search { flex: 1; min-width: 0; }
.seg.sm button { padding: 4px 7px; display: grid; place-items: center; }
.it.dir .chev { width: 14px; }
.it.dir.open .chev { transform: rotate(90deg); }
.it.dir .nm { color: var(--text-2); }
.it.dir .fi { color: var(--faint); }
.it.dir.hc .fi { color: var(--accent); }
.dcnt { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.dcnt .dn { color: var(--sky); }
.it.dir .nm { min-width: 0; }
.it.dir.leaf .chev { visibility: hidden; }
.it.dir.focus .nm { color: var(--text); font-weight: 500; }
.it .dcb { position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; opacity: 0; background: var(--raise); box-shadow: -12px 0 8px -4px var(--raise); }
.it .dcb:hover { background: var(--border-strong); }
.it:hover .dcb { opacity: 1; }
.pop { position: fixed; z-index: 25; }
.fpath { font-family: var(--mono); font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; min-width: 0; flex: 1; text-align: left; }
.cl-card { padding: 0 2px 8px; }
.cl-card .cm { margin: 0; }
.tb { display: flex; align-items: center; gap: 1px; margin-left: 2px; padding-left: 6px; border-left: 1px solid var(--border); }
.tb .ib { width: 28px; height: 28px; border-radius: 6px; }
.tb .ib.on { background: var(--accent-soft); color: var(--accent); }
.tb .ib:disabled { opacity: .35; pointer-events: none; }
.ws { color: var(--faint); }
.ws.tab { position: relative; }
.ws.tab::before { content: "→"; position: absolute; left: 0; top: 0; }
.fb.nowrap { overflow-x: auto; }
.fb.nowrap .code { white-space: pre; overflow-wrap: normal; }
.fb.nowrap .row:not(.sp), .fb.nowrap .half { grid-template-columns: 30px 46px 18px minmax(var(--cw), 1fr); }
.fb.nowrap .row:not(.sp), .fb.nowrap .row.sp, .fb.nowrap .hh { width: max-content; min-width: 100%; }
.fb.nowrap .row.sp { grid-template-columns: minmax(var(--hw), 1fr) minmax(var(--hw), 1fr); }
.fb.nowrap .slot { position: sticky; left: 0; width: 100%; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--raise); color: var(--dim); }
.nav { display: flex; align-items: center; gap: 2px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav .ib { width: 28px; height: 28px; }
.nav .ib:disabled { opacity: .35; pointer-events: none; }
.fb { font-family: var(--mono); font-size: 12.5px; line-height: 1.62; padding-bottom: 6px; }
.fnote { font-family: var(--ui); color: var(--dim); padding: 14px 20px; font-size: 13.5px; }
.lnk { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.hh { padding: 4px 14px 4px 94px; color: var(--dim); background: var(--hunk); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hh:not(:first-child) { margin-top: 2px; }
.row { display: grid; grid-template-columns: 30px 46px 18px minmax(0, 1fr); position: relative; }
.row.add { background: var(--add); }
.row.del { background: var(--del); }
.row.add > .ln, .row.add > .mk, .row.add > .g { background: var(--add-g); }
.row.del > .ln, .row.del > .mk, .row.del > .g { background: var(--del-g); }
.row.sp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.half { display: grid; grid-template-columns: 30px 46px 18px minmax(0, 1fr); position: relative; min-width: 0; }
.half[data-side="o"] { border-right: 1px solid var(--border); }
.half.add { background: var(--add); }
.half.del { background: var(--del); }
.half.add > .ln, .half.add > .mk, .half.add > .g { background: var(--add-g); }
.half.del > .ln, .half.del > .mk, .half.del > .g { background: var(--del-g); }
.half.none { background: repeating-linear-gradient(135deg, transparent 0 7px, var(--hunk) 7px 8px); }
.ln { color: var(--faint); text-align: right; padding-right: 8px; user-select: none; cursor: pointer; }
.row:not(.sp):hover .ln, .half:not(.none):hover .ln { color: var(--accent); }
.add > .ln, .del > .ln { color: var(--dim); }
.mk { color: var(--dim); user-select: none; text-align: center; }
.add > .mk { color: var(--green); }
.del > .mk { color: var(--red); }
.code { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 18px 0 4px; tab-size: 4; min-height: 1.62em; }
.g { position: relative; user-select: none; }
.cb { position: absolute; left: 5px; top: 50%; margin-top: -10px; width: 20px; height: 20px; border-radius: 6px; border: 0; padding: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .08s; }
.row:not(.sp):hover .cb, .half:not(.none):hover .cb, .lsel.edge .cb { opacity: 1; }
.lsel::after { content: ""; position: absolute; inset: 0; background: var(--sel); pointer-events: none; }
.lsel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 1; }
.dragging, .dragging * { cursor: ns-resize !important; user-select: none !important; }
.slot { font-family: var(--ui); font-size: 13.5px; line-height: 1.5; padding: 6px 18px 8px 52px; }
.slot.top { padding-top: 12px; }
.composer { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 10px 10px 14px; box-shadow: var(--shadow); max-width: 780px; }
.composer .lbl { color: var(--dim); font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.composer .in { display: flex; gap: 8px; align-items: flex-end; }
.vtag { font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.vtag.o { background: var(--del-g); color: var(--red); }
.vtag.n { background: var(--add-g); color: var(--green); }
.seg.ver button { font-size: 12px; padding: 2px 9px; }
.seg.ver button.on.o { color: var(--red); }
.seg.ver button.on.n { color: var(--green); }
textarea { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 14px; line-height: 1.45; resize: none; padding: 3px 0; min-height: 26px; max-height: 260px; overflow-y: auto; }
textarea::placeholder { color: var(--faint); }
.send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--faint); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
.send.ready { color: var(--text); background: var(--raise); }
.send.ready:hover { background: var(--accent); color: #fff; }
.hint { color: var(--faint); font-size: 11.5px; margin-top: 4px; }
.cm { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; max-width: 780px; margin: 0 0 8px; overflow: hidden; }
.cm.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }
.cm-h { display: flex; align-items: center; gap: 8px; padding: 9px 10px 0 14px; color: var(--dim); font-size: 12.5px; min-width: 0; }
.cm-h .loc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.acts { display: flex; gap: 2px; margin-left: auto; }
.acts .ib { width: 26px; height: 26px; border-radius: 7px; }
.acts .ib.warn { color: var(--red); background: var(--del); }
.pill { font-size: 11.5px; font-weight: 500; padding: 1px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.pill.PENDING { background: var(--accent-soft); color: var(--accent); }
.pill.IN_PROGRESS { background: rgba(217,119,87,.16); color: var(--claude); }
.pill.IN_PROGRESS::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.pill.HAS_QUESTIONS { background: rgba(224,164,58,.18); color: var(--amber); }
.pill.DONE { background: var(--add-g); color: var(--green); }
.pill.CANCELED, .pill.CLOSED { background: var(--raise); color: var(--dim); }
.cm-t { padding: 5px 14px 11px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.cm.min .cm-t { padding-bottom: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); cursor: pointer; }
.cm.min .cm-x { display: none; }
code { font-family: var(--mono); font-size: .9em; background: var(--raise); padding: 0 4px; border-radius: 4px; }
.msg { padding: 9px 14px 10px; border-top: 1px solid var(--border); }
.who { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-bottom: 3px; }
.who b { font-weight: 500; color: var(--text-2); }
.who .cl { color: var(--claude); display: grid; place-items: center; }
.msg .tx { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .edit { padding: 2px 0 0; }
.macts { display: flex; gap: 2px; margin-left: auto; opacity: 0; transition: opacity .1s; }
.msg:hover .macts, .macts:focus-within, .macts:has(.warn) { opacity: 1; }
.macts .ib { width: 24px; height: 24px; border-radius: 6px; }
.macts .ib.warn { color: var(--red); background: var(--del); }
.qs { padding: 9px 14px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.q .qt { margin-bottom: 5px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--border-strong); background: transparent; border-radius: 8px; padding: 3px 10px; cursor: pointer; color: var(--text-2); font-size: 12.5px; }
.opt:hover { border-color: var(--accent); }
.opt.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.reply { display: flex; gap: 8px; align-items: flex-end; padding: 7px 8px 7px 14px; border-top: 1px solid var(--border); }
.reply textarea { font-size: 13.5px; }
.reply .send { width: 26px; height: 26px; }
.edit { padding: 4px 10px 10px 14px; display: flex; gap: 8px; align-items: flex-end; }
.side .slot { padding: 4px 2px 8px; }
.newgen { margin: 2px 2px 8px; border: 1px dashed var(--border-strong); border-radius: 10px; padding: 8px 12px; color: var(--dim); cursor: pointer; display: flex; align-items: center; gap: 8px; background: transparent; width: calc(100% - 4px); text-align: left; }
.newgen:hover { color: var(--text); border-color: var(--dim); }
.cfilter { padding: 4px 4px 8px; }
.sscope { padding: 4px 4px 2px; }
.sscope:not([hidden]) { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sscope .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; }
.sscope .chip svg { width: 13px; height: 13px; }
.stag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--raise); color: var(--dim); }
.cl-it { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.cl-it:hover { background: var(--raise); }

async function onCardAction(card, action, el) {
  const id = card.dataset.id;
  if (action === 'expand') { S.expanded.add(id); refreshComments(); return; }
  if (action === 'edit-msg') {
    S.editingMsg = `${id}:${el.dataset.i}`;
    refreshComments();
    const ta = $('c-' + id)?.querySelector('textarea[data-role=edit-msg]');
    if (ta) { autosize(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  if (action === 'save-msg') {
    const ta = card.querySelector('textarea[data-role=edit-msg]');
    S.editingMsg = null;
    return act(id, { action: 'edit_reply', index: +el.dataset.i, text: ta.value });
  }
  if (action === 'del-msg') {
    const key = `${id}:${el.dataset.i}`;
    if (S.deleteArm !== key) {
      S.deleteArm = key;
      refreshComments();
      setTimeout(() => { if (S.deleteArm === key) { S.deleteArm = null; refreshComments(); } }, 3000);
      return;
    }
    S.deleteArm = null;
    return act(id, { action: 'delete_reply', index: +el.dataset.i });
  }
  if (action === 'edit') { S.editing = id; refreshComments(); const ta = $('c-' + id)?.querySelector('textarea[data-role=edit]'); if (ta) { autosize(ta); ta.focus(); } return; }
  if (action === 'save') {
    const ta = card.querySelector('textarea[data-role=edit]');
    S.editing = null;
    await act(id, { action: 'edit', comment: ta.value });
    return;
  }
  if (action === 'close') return act(id, { action: 'status', status: 'CLOSED' });
  if (action === 'cancel') return act(id, { action: 'status', status: 'CANCELED' });
  if (action === 'reopen') { S.expanded.delete(id); return act(id, { action: 'status', status: 'PENDING' }); }
  if (action === 'answer') return act(id, { action: 'answer', index: +el.dataset.q, answer: el.dataset.v });
  if (action === 'adopt') return act(id, { action: 'adopt' });
  if (action === 'reply') {
    const ta = card.querySelector('textarea[data-role=reply]');
    if (!ta.value.trim()) return;
    const text = ta.value;
    ta.value = '';
    ta.blur();
    return act(id, { action: 'reply', text });
  }
  if (action === 'delete') {
    if (S.deleteArm !== id) {
      S.deleteArm = id;
      refreshComments();
      setTimeout(() => { if (S.deleteArm === id) { S.deleteArm = null; refreshComments(); } }, 3000);
      return;
    }
    S.deleteArm = null;
    try {
      await api(`/api/comments/${enc(id)}`, { method: 'DELETE' });
      S.comments = S.comments.filter(x => x.id !== id);
      S.csig = '';
      refreshComments();
    } catch (e) { alertCard(id, e); }
  }
}

function addPatterns(kind, text) {

document.addEventListener('mousedown', e => {
  if ($('menu') && !e.target.closest('#menu') && !e.target.closest('#presetBtn')) closeMenu();
  const hit = e.target.closest('.row .cb, .row .g, .row .ln');
  if (hit && e.button === 0) {
    const row = hit.closest('.row');
    const mode = row.classList.contains('sp') ? 's' : 'u';
    const half = hit.closest('.half');
    if (mode === 's' && (!half || half.classList.contains('none'))) return;
    e.preventDefault();
    const idx = mode === 's' ? +row.dataset.s : +row.dataset.r;
    const side = mode === 's' ? half.dataset.side : 'n';
    const s = S.sel;
    if (e.shiftKey && s && s.path === S.cur && s.mode === mode && (mode === 'u' || s.side === side)) S.sel = { ...s, b: idx };
    else S.sel = { path: S.cur, mode, side, a: idx, b: idx };
    S.drag = true;
    document.body.classList.add('dragging');
    paintSel();
    return;
  }
  if ($('folderPop') && !e.target.closest('#folderPop') && !e.target.closest('[data-act="folder-comment"]') && !(S.folderDraft && S.folderDraft.text.trim())) closeFolderComposer();
  if (S.composer && !S.composer.text && !e.target.closest('.composer')) closeComposer();
});

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#sideBtn')) { S.sideOpen = !S.sideOpen; renderTop(); return; }
  if (t.closest('#presetBtn')) { $('menu') ? closeMenu() : openPresetMenu(); return; }
  const lb = t.closest('#listSeg button');
  if (lb) {
    S.listMode = lb.dataset.list;
    store.set('listMode', S.listMode);
    renderSide();
    scrollFileIntoView();
    return;
  }
  const fc = t.closest('[data-act="folder-comment"]');
  if (fc) { openFolderComposer(fc.dataset.dir); return; }
  const ffc = t.closest('[data-act="file-comment"]');
  if (ffc) { revealFile(ffc.dataset.path, openFileComposer); return; }
  const dirRow = t.closest('.it[data-dir]');
  if (dirRow) {
    if (S.listMode === 'dirs' && !e.altKey) pickDir(dirRow.dataset.dir);
    else if (!dirRow.classList.contains('leaf')) toggleDir(dirRow.dataset.dir, e.altKey);
    return;
  }
  if (e.target === $('scrim')) { closeEditor(); return; }
  if (t.closest('#commitHead')) { $('commitSect').classList.toggle('closed'); store.set('commitsClosed', $('commitSect').classList.contains('closed') ? '1' : '0'); return; }
  const tab = t.closest('.tab');
  if (tab) { S.tab = tab.dataset.tab; renderSide(); return; }
  const ss = t.closest('[data-sscope]');
  if (ss) {
    S.sessionScope = ss.dataset.sscope;

  }
  const sc = t.closest('[data-status]');
  if (sc) {
    const st = sc.dataset.status;
    if (!st) S.statusFilter.clear(); else S.statusFilter.has(st) ? S.statusFilter.delete(st) : S.statusFilter.add(st);
    store.set('statusFilter', JSON.stringify([...S.statusFilter]));
    renderCommentList();
    return;
  }
  const scope = t.closest('.scope');
  if (scope) { if (scope.dataset.scope !== S.scope) { S.scope = scope.dataset.scope; S.pendingDiff = null; hideBanner(); loadDiff(true); } return; }
  const it = t.closest('.it');
  if (it) { revealFile(it.dataset.path); if (innerWidth <= 760) { S.sideOpen = false; renderTop(); } return; }
  const cl = t.closest('.cl-it');

    if (c && c.filePath && c.kind !== 'folder' && fileByPath(c.filePath)) revealComment(c.id);
    else if (c) { S.openCard = c.id; renderCommentList(); }
    return;
  }
  if (t.closest('.cl-card .cm-h') && !t.closest('[data-act]')) { S.openCard = null; renderCommentList(); return; }
  const actEl = t.closest('[data-act]');
  if (!actEl) { const pats = t.closest('.pats'); if (pats) pats.querySelector('input').focus(); return; }
  const action = actEl.dataset.act;
  if (action === 'prev') { stepFile(-1); return; }
  if (action === 'next') { stepFile(1); return; }
  if (action === 'show-big') { S.forceBig.add(S.cur); renderDiffs(true); return; }
  if (action === 'side') {
    if (S.sel) S.sel.side = actEl.dataset.side;
    mountComposer(true);
    paintSel();
    return;
  }
  if (action === 'submit') { submitComposer(); return; }
  if (action === 'folder-send') { submitFolder(); return; }
  if (action === 'opt-ws') { changeOpts(o => { o.ws = !o.ws; }, true); return; }
  if (action === 'opt-inv') { changeOpts(o => { o.inv = !o.inv; }); return; }
  if (action === 'opt-wrap') { changeOpts(o => { o.wrap = !o.wrap; }); return; }
  if (action === 'ctx-less') { stepContext(-1); return; }
  if (action === 'ctx-more') { stepContext(1); return; }
  if (action === 'opt-full') { changeOpts(o => { o.full = !o.full; }, true); return; }
  if (action === 'opt-split') { setView(S.view === 'split' ? 'unified' : 'split'); return; }
  if (action === 'apply-diff') { const d = S.pendingDiff; S.pendingDiff = null; hideBanner(); if (d) applyDiff(d, false); return; }
  if (action === 'gen-open') { S.gen = true; renderCommentList(); return; }
  if (action === 'adopt-lost') { adoptLost(); return; }
  if (action === 'gen-send') { submitGeneral(); return; }
  if (action === 'pick-preset') {
    closeMenu();
    S.presetDeleteArm = false;
    setPreset(actEl.dataset.id);
    if (S.editor) renderEditor();
    return;
  }
  if (action === 'edit-presets') { openEditor(); return; }
  if (action === 'close-editor') { closeEditor(); return; }
  if (action === 'new-preset' || action === 'dup-preset') {
    const base = preset();
    const p = action === 'new-preset'
      ? { id: 'p' + Date.now().toString(36), name: 'New preset', include: [], exclude: [] }

  }
  if (action === 'rm-pat') { preset()[actEl.dataset.kind].splice(+actEl.dataset.i, 1); presetChanged(); return; }
  if (action === 'cycle-ext') {
    const p = preset();
    const pat = actEl.dataset.pat;
    if (p.include.includes(pat)) { p.include = p.include.filter(x => x !== pat); p.exclude.push(pat); }
    else if (p.exclude.includes(pat)) p.exclude = p.exclude.filter(x => x !== pat);

});

  const btn = t.parentElement.querySelector('.send');
  if (btn && t.dataset.role !== 'edit') btn.classList.toggle('ready', !!t.value.trim());
  if (t.dataset.role === 'composer' && S.composer) S.composer.text = t.value;
  if (t.dataset.role === 'folder' && S.folderDraft) S.folderDraft.text = t.value;
});
document.addEventListener('paste', e => {
  const t = e.target;
  if (!t.matches?.('.pats input')) return;
  const text = e.clipboardData.getData('text');
  if (!/[,\s]/.test(text.trim())) return;
  e.preventDefault();
  addPatterns(t.dataset.kind, text);
  t.value = '';
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') {
    if ($('menu')) { closeMenu(); return; }
    if (S.editor) { closeEditor(); return; }
    if (t.dataset?.role === 'composer' || (t.tagName !== 'TEXTAREA' && S.composer)) { closeComposer(); return; }
    if (t.dataset?.role === 'edit') { S.editing = null; refreshComments(); return; }
    if (t.dataset?.role === 'edit-msg') { S.editingMsg = null; refreshComments(); return; }
    if (t.dataset?.role === 'gen') { S.gen = false; t.value = ''; renderCommentList(); return; }
    if ($('folderPop')) { S.folderDraft = null; closeFolderComposer(); return; }
    if (S.openCard && !t.closest?.('textarea')) { S.openCard = null; renderCommentList(); return; }
    if (t.dataset?.role === 'reply') { t.value = ''; t.blur(); return; }
  }
  if (t.matches?.('.pats input')) {
    if ((e.key === 'Enter' || e.key === ',' || (e.key === 'Tab' && t.value.trim())) && t.value.trim()) {
      e.preventDefault();
      addPatterns(t.dataset.kind, t.value);
      t.value = '';
    } else if (e.key === 'Backspace' && !t.value) {
      const list = preset()[t.dataset.kind];
      if (list.length) { list.pop(); presetChanged(); }
    }
    return;
  }
  if (t.id === 'presetName' && e.key === 'Enter') { t.blur(); return; }
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && t.tagName !== 'TEXTAREA' && !S.editor) {
    e.preventDefault();
    stepFile(e.key === 'ArrowUp' ? -1 : 1);
    return;
  }
  if (t.tagName !== 'TEXTAREA' || e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  const role = t.dataset.role;
  if (role === 'composer') submitComposer();
  else if (role === 'gen') submitGeneral();
  else if (role === 'folder') submitFolder();
  else { const card = t.closest('.cm'); if (card) onCardAction(card, { edit: 'save', 'edit-msg': 'save-msg' }[role] || 'reply', t); }
});
$('search').addEventListener('input', e => {
  S.filter = e.target.value;
  const before = S.cur;
  current();
  renderTop();
  renderSide();
  if (S.cur !== before) renderDiffs(false);
});

function dragResize(handle, bodyClass, onMove, onDone) {
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY };
    handle.classList.add('on');
    document.body.classList.add(bodyClass);
    let last = null, raf = 0;
    const apply = () => { raf = 0; if (last) onMove(last.clientX - start.x, last.clientY - start.y); };
    const move = ev => { last = ev; if (!raf) raf = requestAnimationFrame(apply); };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      if (raf) cancelAnimationFrame(raf);
      apply();
      handle.classList.remove('on');
      document.body.classList.remove(bodyClass);
      onDone();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
function setSideWidth(w) {
  w = Math.round(Math.min(Math.max(w, 220), Math.max(220, innerWidth - 320)));
  $('side').style.width = w + 'px';
}
function setCommitsHeight(h) {
  h = Math.round(Math.min(Math.max(h, 90), Math.max(90, $('side').getBoundingClientRect().height - 160)));
  $('commitSect').style.height = h + 'px';
}
let sideStart = 0, commitsStart = 0;
$('resizer').addEventListener('mousedown', () => {
  sideStart = $('side').getBoundingClientRect().width;
  const sec = document.querySelector('#diffs .file');
  if (sec) sec.style.width = sec.getBoundingClientRect().width + 'px';
  $('diffs').style.overflowX = 'hidden';
}, true);
$('vresizer').addEventListener('mousedown', () => { commitsStart = $('commitSect').getBoundingClientRect().height; }, true);
dragResize($('resizer'), 'resizing', dx => setSideWidth(sideStart + dx), () => {
  const sec = document.querySelector('#diffs .file');
  if (sec) sec.style.width = '';
  $('diffs').style.overflowX = '';
  store.set('sideWidth', String(Math.round($('side').getBoundingClientRect().width)));
});
$('fileList').addEventListener('scroll', paintFileWindow);
new ResizeObserver(paintFileWindow).observe($('fileList'));
dragResize($('vresizer'), 'resizing-v', (dx, dy) => setCommitsHeight(commitsStart - dy), () => store.set('commitsHeight', String(Math.round($('commitSect').getBoundingClientRect().height))));
$('resizer').addEventListener('dblclick', () => { setSideWidth(SIDE_W); store.set('sideWidth', null); });
$('vresizer').addEventListener('dblclick', () => { $('commitSect').style.height = ''; store.set('commitsHeight', null); });

$('sideBtn').innerHTML = I.side;
$('listSeg').innerHTML = `<button data-list="list" title="Flat list">${I.list}</button><button data-list="tree" title="Folder tree">${I.tree}</button><button data-list="dirs" title="Folders only">${I.folder}</button>`;
$('searchIcon').innerHTML = I.search;
$('commitChev').innerHTML = I.chev;
if (store.get('commitsClosed') === '1') $('commitSect').classList.add('closed');
if (store.get('sideWidth')) setSideWidth(+store.get('sideWidth'));
if (store.get('commitsHeight')) setCommitsHeight(+store.get('commitsHeight'));
renderTop();
loadInfo();
api('/api/presets').then(j => { S.presets = j.presets; }).catch(() => { S.presets = [{ id: 'all', name: 'All files', include: [], exclude: [] }]; })
  .then(() => loadDiff(true)).then(() => { pollComments(); pollDiff(); });
function holdPresence() {
  const source = new EventSource('/api/presence');
  source.onerror = () => { if (source.readyState === EventSource.CLOSED) setTimeout(holdPresence, 1000); };
}
holdPresence();
setInterval(() => { if (!busy()) refreshComments(); }, 60000);
</script>
